name: Build and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS (Apple Silicon)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Check release version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag must match the Tauri app version: v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - name: Build application
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run bundle -- --ci --target aarch64-apple-darwin -- --locked

      - name: Verify and package DMG
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dmg="src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/Mac Cleaner_${APP_VERSION}_aarch64.dmg"
          hdiutil verify "$dmg"
          dmg_mount=$(mktemp -d)
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$dmg_mount"
          trap 'hdiutil detach "$dmg_mount" >/dev/null' EXIT
          codesign --verify --deep --strict --verbose=2 "$dmg_mount/Mac Cleaner.app"
          mkdir -p release
          cp "$dmg" release/MacCleaner-arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: MacCleaner-macos-arm64
          path: release/*.dmg
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: MacCleaner-macos-arm64
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          gh release create "$RELEASE_TAG" release/*.dmg \
            --verify-tag --generate-notes \
            --title "Mac Cleaner $RELEASE_TAG" --prerelease="$PRERELEASE"
